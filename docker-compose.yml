services:
  backend:
    build: ./backend
    container_name: salon_backend
    restart: always
    volumes:
      - ./data:/app/data
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: salon_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: salon_tunnel
    restart: always
    command: tunnel run
    environment:
      # El token del túnel vive en el archivo .env de la raíz (ignorado por git),
      # nunca en este archivo versionado.
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - frontend
