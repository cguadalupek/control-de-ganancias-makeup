version: '3.8'

services:
  backend:
    build: ./backend
    container_name: salon_backend
    restart: always
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: salon_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend